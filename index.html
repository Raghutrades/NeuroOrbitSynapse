<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeuroOrbitSynapse</title>
<meta name="description" content="Wire your habits. Orbit your goals.">
<meta name="theme-color" content="#07090f" id="tcolor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#0e121c;--line:#232a3b;--ink:#e9ecf5;--mute:#8d96ad;--acc:#ff8a2b;--acc2:#ff5d73;--onacc:#10131c;--good:#3ddc97;--bad:#ff5d73;--r:14px;--top:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.mute{color:var(--mute)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:700}.hide{display:none!important}
::selection{background:var(--acc);color:var(--onacc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* animated sideways color field */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.2;will-change:transform}
#bgfx i:nth-child(1){left:-25vmax;top:-20vmax;background:var(--b1,var(--acc));animation:drift1 38s ease-in-out infinite alternate}
#bgfx i:nth-child(2){right:-30vmax;top:10vh;background:var(--b2,var(--acc2));animation:drift2 46s ease-in-out infinite alternate}
#bgfx i:nth-child(3){left:10vw;bottom:-35vmax;background:var(--b3,#5b7cff);animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(70vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-75vw,-8vh) scale(.9)}}
@keyframes drift3{to{transform:translate(55vw,-14vh) scale(1.2)}}
body.reduce #bgfx i{animation:none}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;display:flex;align-items:center;gap:18px;padding:0 20px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--mute);letter-spacing:.01em;margin-top:-2px}
#nav{display:flex;gap:4px;margin-left:12px}
#nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:600;display:flex;gap:7px;align-items:center;transition:.15s}
#nav button svg{width:17px;height:17px}
#nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
#nav button.on{color:var(--onacc);background:var(--acc)}
#topr{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:.15s;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.ibtn svg{width:18px;height:18px}.ibtn:hover{border-color:var(--acc)}.ibtn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
/* views */
#app{position:relative;z-index:1;padding-top:var(--top);min-height:100vh}
.view{display:none}.view.on{display:block}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 90px}
.card{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px)}
.card h3,.h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.vt{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.row{display:flex;gap:10px;align-items:center}.wrapr{flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.pill.must{color:#ffd23f;border-color:#ffd23f66}.pill.quit{color:var(--bad);border-color:#ff5d7366}.pill.ok{color:var(--good);border-color:#3ddc9766}
.bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
/* HOME */
#v-home .wrap{max-width:none;padding:12px 16px 24px}
#hero{display:grid;grid-template-columns:1.1fr 1.3fr auto;gap:18px;align-items:center;padding:6px 6px 14px}
#greet{font-size:26px;letter-spacing:-.02em;font-weight:800;line-height:1.1}
#clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);margin-top:4px}
#quote{font-size:21px;line-height:1.25;min-height:54px;transition:opacity .7s}
#quote small{display:block;font-family:inherit;font-size:12px;color:var(--mute);margin-top:4px}
#kpis{display:flex;gap:10px}
.kpi{min-width:92px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.1}.kpi span{font-size:11.5px;color:var(--mute)}
.hbars{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--mute)}.hbars>div{flex:1;min-width:90px}.hbars .bar{margin-top:4px;height:4px}
#homegrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
#mapwrap{position:relative;height:calc(100vh - var(--top) - 150px);min-height:440px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--acc) 7%,var(--bg)),var(--bg) 75%);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}
#cv:active{cursor:grabbing}
#mapwrap.fs{position:fixed;inset:0;z-index:100;border:0;border-radius:0;height:100vh;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--acc) 9%,var(--bg)),var(--bg) 80%)}
#mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;color:var(--mute)}.seg button.on{background:var(--acc);color:var(--onacc)}
#mapbtns{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:3}
#mapwrap.fs #mapctl,#mapwrap.fs #mapbtns,#mapwrap.fs #legend{opacity:0;pointer-events:none}
#legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--mute);z-index:3;background:color-mix(in srgb,var(--bg) 60%,transparent);padding:6px 10px;border-radius:9px}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#mapinfo{position:absolute;z-index:4;left:50%;bottom:16px;transform:translateX(-50%);width:min(430px,92%);padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);display:none}
#mapinfo.on{display:block}
#mapwrap.fs #mapinfo{display:none}
#fsx{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff44;background:#00000066;color:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
#fsx.show{opacity:.85;pointer-events:auto}#fsx svg{width:18px;height:18px}
#emptymap{position:absolute;inset:0;display:none;place-items:center;text-align:center;z-index:2;padding:20px}
#emptymap.on{display:grid}
#emptymap>div{max-width:380px;pointer-events:auto}
#emptymap h3{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
/* Today list */
.titem{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 40%,transparent);margin-bottom:8px;position:relative;overflow:hidden}
.titem.done{opacity:.62}
.titem .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;border:2px solid var(--c)}
.titem.quit .dot{border-style:dashed}
.titem .nm{font-weight:700;cursor:pointer;line-height:1.2}
.titem .sub{font-size:12px;color:var(--mute)}
.titem.must::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ffd23f}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:none;flex:none;display:grid;place-items:center;color:var(--c);transition:.15s}
.chk:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}.chk.on{background:var(--c);color:#06080d}.chk svg{width:18px;height:18px}
.qa{display:flex;gap:6px}.qa .btn{padding:6px 10px;font-size:12.5px}
.nextup{border:1px dashed color-mix(in srgb,var(--acc) 60%,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;background:color-mix(in srgb,var(--acc) 7%,transparent)}
/* drawer & modal */
#shade{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:.2s}#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:41;background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#drawer.on{transform:none}
#dhead{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#dtabs{display:flex;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
#dtabs button{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--mute);font-weight:600}#dtabs button.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--ink)}
#dbody{flex:1;overflow:auto;padding:16px 18px 40px}
#modal{position:fixed;z-index:42;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#mbox{width:min(760px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
/* forms */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;padding:6px 11px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mute)}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border:1px solid var(--line);border-radius:12px;background:none;text-align:left;min-width:0}
.tpl:hover{border-color:var(--acc)}.tpl.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}.tpl b{font-size:13.5px}.tpl span{font-size:11.5px;color:var(--mute)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exbox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--acc) 6%,transparent);font-size:13px}
.fld{margin-top:12px}.fld>label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:5px}
.fld .ex{font-weight:400;color:var(--mute);font-size:12px}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;font-size:24px;color:var(--line);padding:0 2px}.stars button.on{color:#ffd23f}
.togg{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line);transition:.2s;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--acc)}.sw.on::after{left:19px}
/* goals view */
.gcard{display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s}.gcard:hover{border-color:var(--acc);transform:translateY(-1px)}
.ring{width:56px;height:56px;flex:none;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:11.5px;color:var(--mute);text-align:center;font-weight:600}
.cday{min-height:88px;border:1px solid var(--line);border-radius:10px;padding:6px;background:color-mix(in srgb,var(--panel) 80%,transparent);cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cday:hover{border-color:var(--acc)}.cday.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.cday.sel{background:color-mix(in srgb,var(--acc) 14%,var(--panel))}.cday.out{opacity:.35}
.cday .n{font-size:12px;font-weight:700}
.ce{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ce.done{background:var(--c);color:#06080d;font-weight:700}.ce.slip{background:#ff5d7355;border-color:#ff5d73}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}.heat i{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}table.t th{color:var(--mute);font-weight:600;font-size:12px}
.svgc{width:100%;height:auto;display:block}
/* toast */
#toasts{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,94%)}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0008;animation:tin .25s}
.toast button{background:none;border:0;color:var(--acc);font-weight:800;padding:0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* credit */
#credit{position:relative;z-index:2;text-align:center;padding:16px 10px 74px;font-size:13px;color:var(--mute)}
#credit .heart{display:inline-block;color:#ff2d55;animation:beat 1.2s infinite;margin:0 3px}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
#credit a{color:#ff9500;text-decoration:none;font-weight:700;transition:.2s}#credit a:hover{color:#e1306c;text-shadow:0 0 12px #e1306c88}
/* splash */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .7s;animation:splashSafe .6s 6.5s forwards}
#splash.out{opacity:0;pointer-events:none}
@keyframes splashSafe{to{opacity:0;visibility:hidden}}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash .sc{position:relative;z-index:2;padding:20px;max-width:560px}
#splash .tg{font-size:19px;opacity:0;animation:fadein 1s 1.6s forwards}
#splash .sq{margin-top:28px;font-size:15px;color:var(--mute);opacity:0;animation:fadein 1s 2.2s forwards;font-style:italic}
#splash .ss{margin-top:18px;font-size:12.5px;color:var(--mute);opacity:0;animation:fadein 1s 2.8s forwards}
@keyframes fadein{to{opacity:1}}
/* bottom nav (mobile) */
#bnav{display:none}
/* responsive */
@media(max-width:1100px){#homegrid{grid-template-columns:1fr}#mapwrap{height:68vh}#hero{grid-template-columns:1fr}#kpis{flex-wrap:wrap}}
@media(max-width:820px){
 :root{--top:52px}#nav{display:none}.brand small{display:none}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 #bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 0;color:var(--mute);font-weight:600}#bnav button svg{width:21px;height:21px}#bnav button.on{color:var(--acc)}
 .g2,.g3,.g4{grid-template-columns:1fr 1fr}.wrap{padding:14px 12px 90px}#greet{font-size:22px}#quote{font-size:18px}
 #mapwrap{height:62vh;min-height:360px}.cday{min-height:58px;padding:3px}.ce{font-size:9.5px;padding:0 3px}
 #topr .btn span{display:none}
}
@media(max-width:820px){#hero{gap:8px;padding-bottom:8px}#hbars{display:none}#kpis{flex-wrap:nowrap;gap:6px}.kpi{min-width:0;flex:1;padding:7px 8px}.kpi b{font-size:18px}.kpi span{font-size:10.5px;line-height:1.2;display:block}#quote{min-height:0;font-size:17px}#toasts{bottom:calc(74px + env(safe-area-inset-bottom))}.toast{font-size:13px;padding:8px 12px}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}.kpi{min-width:0;flex:1}.cal{gap:3px}.ce{display:none}.cday .dots{display:flex}}
.dots{display:flex;gap:2px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}.dots i.h{background:none;border:1.5px solid var(--c)}
@media print{#top,#bnav,#bgfx{display:none}}
</style></head><body>
<div id="bgfx"><i></i><i></i><i></i></div>
<div id="splash"><canvas id="spcv"></canvas><div class="sc"><div id="spname" style="height:110px"></div><div class="tg serif" id="sptag"></div><div class="sq serif" id="spq"></div><div class="ss" id="sps"></div></div></div>
<header id="top">
 <button class="brand" data-act="nav" data-v="home" aria-label="NeuroOrbitSynapse home">
  <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="3.4" fill="var(--acc)"/><ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="var(--acc2)" stroke-width="1.4" transform="rotate(-28 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="var(--ink)" stroke-opacity=".5" stroke-width="1" transform="rotate(32 16 16)"/><circle cx="27.3" cy="10.6" r="2" fill="var(--ink)"/><circle cx="5" cy="21.5" r="1.6" fill="var(--acc2)"/></svg>
  <span>NeuroOrbitSynapse<small id="tagline"></small></span></button>
 <nav id="nav" aria-label="Main"></nav>
 <div id="topr"><button class="ibtn" data-act="snd" id="sndbtn" title="Sound" aria-label="Sound"></button><button class="btn pri" data-act="newgoal" id="addbtn"></button></div>
</header>

 goals:S.goals.map(g=>{const s=gStats(g);return{name:g.name,kind:isB(g)?'quit':'build',priority:PRI[g.priority].n,category:g.cat,schedule:schedText(g),window:g.win?g.win.join(' to '):null,reminders:g.remind.on?g.remind.times:[],round:{start:g.start,end:g.end,days:lenDays(g),paused:g.paused},why:g.why,cue:g.cue,successLooks:g.metric,
  stats:{repsDone:s.done,repsExpectedSoFarOrRound:s.expT,adherencePct:s.adh==null?null:Math.round(s.adh*100),currentStreak:s.streak+' '+s.unit,bestStreak:s.best,strengthPct:Math.round(s.level*100),minutesLogged:s.min,avgQuality:s.q?+s.q.toFixed(2):null,slips:s.slips,urgesRiddenOut:s.urges,pace:s.pace},
  logFields:g.fields.map(f=>f.label+(f.unit?' ('+f.unit+')':'')),checklist:g.tasks,reviews:(g.reviews||[]).map(r=>({date:r.d.slice(0,10),worked:r.w,gotInTheWay:r.b,change:r.a,rating:r.r})),logs:logRows(g)}}),
 dailyCheckins:Object.keys(S.daily).sort().map(k=>Object.assign({date:k},S.daily[k])),badgesEarned:S.badges,_state:S}}
ACT.exjson=()=>{S.set.lastExport=todayKey();save();downloadText(`neuroorbitsynapse-backup-${stamp()}.json`,JSON.stringify(exportObj(),null,2),'application/json');checkBadges();toast('Backup downloaded');if(UI.view==='set')renderSet()};
ACT.excsv=()=>{const rows=[];S.goals.forEach(g=>logRows(g).forEach(r=>rows.push(Object.assign({goal:g.name,kind:isB(g)?'quit':'build'},r))));
 const base=['date','goal','kind','status','time','minutes','prepMinutes','quality','amount','urges','trigger'],ext=[];rows.forEach(r=>{if(r.fields)Object.keys(r.fields).forEach(k=>{if(!ext.includes(k))ext.push(k)})});
 const cols=base.concat(ext,['checklistDone','note']),q=v=>{v=v==null?'':Array.isArray(v)?v.join('; '):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.goal.localeCompare(b.goal));
 const out=[cols.join(',')].concat(rows.map(r=>cols.map(c=>base.includes(c)||c==='checklistDone'||c==='note'?q(r[c]):q(r.fields&&r.fields[c])).join(',')));downloadText(`neuroorbitsynapse-logs-${stamp()}.csv`,out.join('\n'),'text/csv');toast('CSV downloaded')};
function mdReport(){const t=todayKey(),o=exportObj();let L=[`# ${APPNAME} progress report`,`Generated ${fmtLong(t)}`,'',`Brain strength ${o.summary.brainStrengthPct}%. Completion: ${o.summary.completionLast7DaysPct}% over 7 days, ${o.summary.completionLast30DaysPct}% over 30 days. ${o.summary.activeGoals} active goal(s).`,''];
 o.goals.forEach(g=>{L.push(`## ${g.name} (${g.kind}, ${g.priority})`,`- Schedule: ${g.schedule}${g.window?', window '+g.window:''}`,`- Round: ${g.round.start} to ${g.round.end}${g.round.paused?' (paused)':''}`,`- Reps ${g.stats.repsDone}/${g.stats.repsExpectedSoFarOrRound}, adherence ${g.stats.adherencePct==null?'n/a':g.stats.adherencePct+'%'}, streak ${g.stats.currentStreak}, best ${g.stats.bestStreak}, strength ${g.stats.strengthPct}%`,`- Time logged ${g.stats.minutesLogged} min${g.stats.avgQuality?', avg quality '+g.stats.avgQuality:''}${g.kind==='quit'?`, slips ${g.stats.slips}, urges ${g.stats.urgesRiddenOut}`:''}`);
  if(g.why)L.push(`- Why: ${g.why}`);if(g.cue)L.push(`- Cue: ${g.cue}`);const last=g.logs.slice(-14);if(last.length){L.push('','Recent logs:');last.forEach(l=>L.push(`- ${l.date} ${l.status}${l.minutes?' '+l.minutes+'m':''}${l.fields?' '+Object.entries(l.fields).map(e=>e.join(': ')).join(', '):''}${l.note?' | '+l.note:''}`))}
  if(g.reviews.length){L.push('','Latest review:');const r=g.reviews[0];L.push(`- ${r.date}: worked "${r.worked}", obstacle "${r.gotInTheWay}", change "${r.change}"`)}L.push('')});
 const dc=o.dailyCheckins.slice(-14);if(dc.length){L.push('## Daily check-ins');dc.forEach(d=>L.push(`- ${d.date}: mood ${d.mood||'-'}, energy ${d.energy||'-'}, sleep ${d.sleep==null?'-':d.sleep+'h'}${d.note?' | '+d.note:''}`))}return L.join('\n')}

function importData(o){let inc=null;
 if(Array.isArray(o))inc=normState({goals:fromLegacyGoals(o)});
 else if(o&&o._state&&o._state.goals)inc=normState(o._state);
 else if(o&&Array.isArray(o.goals)&&o.goals.length&&o.goals[0].logs&&!o.goals[0].stats)inc=normState(o);
 if(!inc||!inc.goals.length){toast('No goals found in that file.');return}
 let add=0,upd=0;inc.goals.forEach(ng=>{const ex=gById(ng.id)||S.goals.find(g=>g.name===ng.name&&g.start===ng.start);
  if(ex){Object.assign(ex.logs,ng.logs);Object.keys(ng.chk||{}).forEach(k=>{ex.chk[k]=ng.chk[k]});if((ng.reviews||[]).length>(ex.reviews||[]).length)ex.reviews=ng.reviews;upd++}else{S.goals.push(ng);add++}});
 Object.keys(inc.daily).forEach(k=>{S.daily[k]=Object.assign({},inc.daily[k],S.daily[k]||{})});
 inc.badges.forEach(b=>{if(!S.badges.some(x=>(x.id||x)===(b.id||b)))S.badges.push(b)});
 S.goals=S.goals.map(g=>normGoal(g));save();sfx('create');toast(`Imported: ${add} new goal(s), ${upd} updated.`);ORDER_RESET();renderAll()}

 const lastEx=s.lastExport?diffD(s.lastExport,todayKey()):null;
 $('#setc').innerHTML=`<h2 class="vt">Settings</h2>

  ${tgl('reduceMotion',s.reduceMotion,'Reduce motion','Calms the background, particles and auto-rotation')}${tgl('splash',s.splash,'Show the opening animation')}</div>

 <div class="card" style="margin-top:14px"><h3>${ic('bell')} Alerts and reminders</h3>
  <div class="row wrapr"><span class="pill ${perm==='granted'?'ok':perm==='denied'?'quit':''}">Notifications: ${perm==='granted'?'on':perm==='denied'?'blocked':perm==='unsupported'?'not supported':'not enabled yet'}</span>${perm!=='granted'&&perm!=='unsupported'?`<button class="btn sm pri" data-act="notifreq">Enable notifications</button>`:''}<button class="btn sm" data-act="notiftest">Send a test</button></div>
  <p class="xs mute">Reminders you set on each goal fire at that exact time while the app is open or running in the background. Browsers can pause web pages to save battery, so for alerts you can never miss, also add them to your phone calendar below.</p>

  <h3 class="h3" style="margin-top:16px">Custom reminders</h3>${S.reminders.map((r,i)=>`<div class="row sm" style="padding:6px 0;border-bottom:1px solid var(--line)"><label class="togg" data-act="remtog" data-i="${i}"><span class="sw ${r.on?'on':''}"></span></label><b>${r.time}</b><span style="flex:1">${esc(r.msg||(r.goal&&gById(r.goal)?gById(r.goal).name:'Reminder'))}</span><button class="btn sm ghost" data-act="remdel" data-i="${i}">${ic('trash')}</button></div>`).join('')||'<div class="xs mute">None yet.</div>'}
  <div class="row wrapr" style="margin-top:8px"><input type="time" id="rm-t" value="09:00" style="max-width:120px"><input type="text" id="rm-m" placeholder="Message" style="flex:1;min-width:140px"><select id="rm-g" style="max-width:180px"><option value="">No goal</option>${S.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><button class="btn sm" data-act="remadd">Add</button></div>

/* ===== splash + init ===== */
let SPDONE=false;
function endSplash(){if(SPDONE)return;SPDONE=true;const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),900);try{sfx('splash')}catch(e){}afterSplash()}
function splashAnim(){const c=$('#spcv'),x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.scale(dpr,dpr);
 const th=THEMES[S.set.theme]||THEMES.blue,txt=APPNAME,fs=Math.min(w*.105,86),oc=document.createElement('canvas');oc.width=w;oc.height=Math.ceil(fs*1.6);const ox=oc.getContext('2d');
 ox.fillStyle='#fff';ox.font=`800 ${fs}px "Bricolage Grotesque",system-ui,sans-serif`;ox.textAlign='center';ox.textBaseline='middle';ox.fillText(txt,w/2,oc.height/2);
 const img=ox.getImageData(0,0,oc.width,oc.height).data,step=w<600?3:4,P=[],nb=$('#spname').getBoundingClientRect(),ty=nb.top+nb.height/2-oc.height/2;
 for(let yy=0;yy<oc.height;yy+=step)for(let xx=0;xx<oc.width;xx+=step)if(img[(yy*oc.width+xx)*4+3]>128)P.push({tx:xx,ty:yy+ty,x:Math.random()*w,y:Math.random()*h,vx:0,vy:0,d:Math.random()*.5,a:Math.random()});
 const cols=th.neb.map(n=>`rgb(${n})`),t0=performance.now();let raf;
 const draw=now=>{if(SPDONE)return;const t=(now-t0)/1000;x.clearRect(0,0,w,h);
  P.forEach((p,i)=>{const k=clamp((t-p.d)/1.5,0,1),e=1-Math.pow(1-k,3);const sx=p.x+(p.tx-p.x)*e,sy=p.y+(p.ty-p.y)*e,wob=Math.sin(t*2+i)*.6*(k>=1?1:0);
   x.globalAlpha=.35+.65*Math.min(1,k*1.5);x.fillStyle=i%7===0?th.acc:i%5===0?cols[0]:'#fff';x.fillRect(sx+wob,sy+wob,2.2,2.2)});
  x.globalAlpha=1;x.globalCompositeOperation='lighter';for(let i=0;i<10;i++){const a=t*.35+i*.63,rx=w/2+Math.cos(a)*(w*.34),ry=h/2+Math.sin(a*1.3)*h*.3;const g=x.createRadialGradient(rx,ry,0,rx,ry,w*.22);g.addColorStop(0,`rgba(${th.neb[i%3]},.07)`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(rx-w*.22,ry-w*.22,w*.44,w*.44)}x.globalCompositeOperation='source-over';
  raf=requestAnimationFrame(draw)};raf=requestAnimationFrame(draw)}
function runSplash(){const sp=$('#splash');if(!S.set.splash||reduced()&&false){sp.remove();SPDONE=true;afterSplash();return}
 $('#sptag').textContent=TAGLINE;$('#spq').textContent='"'+SPLASH_Q[Math.floor(Math.random()*SPLASH_Q.length)]+'"';
 const k=todayKey(),it=todayItems(k).filter(i=>i.st.s==='due'),mx=S.goals.filter(g=>g.priority==='must'&&dueState(g,k).s==='due');
 $('#sps').textContent=S.goals.length?(it.length?`${it.length} goal${it.length===1?'':'s'} due today${mx.length?', '+mx.length+' marked Must':''}`:'Nothing due. Rest or get ahead.'):'Welcome. Plant your first neuron.';
 if(!reduced()){$('#spname').textContent='';const go=()=>{try{splashAnim()}catch(e){$('#spname').innerHTML=`<div class="b" style="font-size:44px">${APPNAME}</div>`}};if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('800 60px "Bricolage Grotesque"'),new Promise(r=>setTimeout(r,900))]).then(go)}else go();setTimeout(endSplash,3900)}
 else{$('#spname').innerHTML=`<div class="b" style="font-size:40px;letter-spacing:-.02em">${APPNAME}</div>`;setTimeout(endSplash,1800)}
 sp.addEventListener('click',endSplash)}
function afterSplash(){BADGE_QUIET=false;setTimeout(()=>{catchUp();checkAlerts()},400);handleParams();if(S.set.snd.amb)ambience(true)}
function handleParams(){const p=new URLSearchParams(location.search);let ch=false;
 if(p.get('done')){const g=gById(p.get('done'));if(g&&dueState(g).s!=='done'){logDone(g);save();toast('Logged from notification: '+g.name);ch=true}}
 if(p.get('goal')){const g=gById(p.get('goal'));if(g)setTimeout(()=>openDrawer(g.id),500)}

 /* map mode/layout also refresh settings */

 $('#fsx').innerHTML=ic('fsx');checkBadges();
 UI.view=S.set.view&&VIEWS.some(v=>v[0]===S.set.view)?S.set.view:'home';go(UI.view);startQuotes();swInit();
 if(st==='migrated')setTimeout(()=>toast(`Welcome to NeuroOrbitSynapse. Your ${S.goals.length} earlier goal${S.goals.length===1?'':'s'} and all logs carried over.`),4200);
 runSplash();requestAnimationFrame(frame);
 let lastDay=todayKey();
 setInterval(()=>{tickClock();const k=todayKey();if(k!==lastDay){lastDay=k;REV++;renderAll()}},1000);
 setInterval(()=>{checkAlerts()},15000);setInterval(()=>{if(!document.hidden&&UI.view==='home'){renderHero();renderToday()}},60000);

 document.addEventListener('pointerdown',()=>{try{ac()}catch(e){}},{once:true});
 window.__nos={S:()=>S,go,UI,fireGoal,ORDER:()=>ORDER}}
init();
