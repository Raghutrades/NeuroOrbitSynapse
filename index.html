<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeuroOrbitSynapse</title>
<meta name="description" content="Wire your habits. Orbit your goals.">
<meta name="theme-color" content="#07090f" id="tcolor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#0e121c;--line:#232a3b;--ink:#e9ecf5;--mute:#8d96ad;--acc:#ff8a2b;--acc2:#ff5d73;--onacc:#10131c;--good:#3ddc97;--bad:#ff5d73;--r:14px;--top:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.mute{color:var(--mute)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:700}.hide{display:none!important}
::selection{background:var(--acc);color:var(--onacc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* animated sideways color field */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.2;will-change:transform}
#bgfx i:nth-child(1){left:-25vmax;top:-20vmax;background:var(--b1,var(--acc));animation:drift1 38s ease-in-out infinite alternate}
#bgfx i:nth-child(2){right:-30vmax;top:10vh;background:var(--b2,var(--acc2));animation:drift2 46s ease-in-out infinite alternate}
#bgfx i:nth-child(3){left:10vw;bottom:-35vmax;background:var(--b3,#5b7cff);animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(70vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-75vw,-8vh) scale(.9)}}
@keyframes drift3{to{transform:translate(55vw,-14vh) scale(1.2)}}
body.reduce #bgfx i{animation:none}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;display:flex;align-items:center;gap:18px;padding:0 20px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--mute);letter-spacing:.01em;margin-top:-2px}
#nav{display:flex;gap:4px;margin-left:12px}
#nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:600;display:flex;gap:7px;align-items:center;transition:.15s}
#nav button svg{width:17px;height:17px}
#nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
#nav button.on{color:var(--onacc);background:var(--acc)}
#topr{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:.15s;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.ibtn svg{width:18px;height:18px}.ibtn:hover{border-color:var(--acc)}.ibtn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
/* views */
#app{position:relative;z-index:1;padding-top:var(--top);min-height:100vh}
.view{display:none}.view.on{display:block}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 90px}
.card{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px)}
.card h3,.h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.vt{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.row{display:flex;gap:10px;align-items:center}.wrapr{flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.pill.must{color:#ffd23f;border-color:#ffd23f66}.pill.quit{color:var(--bad);border-color:#ff5d7366}.pill.ok{color:var(--good);border-color:#3ddc9766}
.bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
/* HOME */
#v-home .wrap{max-width:none;padding:12px 16px 24px}
#hero{display:grid;grid-template-columns:1fr 1.5fr auto;gap:16px;align-items:center;padding:2px 6px 8px}
#greet{font-size:22px;letter-spacing:-.02em;font-weight:800;line-height:1.1}
#clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);margin-top:4px}
#quote{font-size:18px;line-height:1.22;min-height:46px;transition:opacity .7s}
#quote small{display:block;font-family:inherit;font-size:12px;color:var(--mute);margin-top:4px}
#kpis{display:flex;gap:10px}
.kpi{min-width:84px;padding:7px 11px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.kpi b{display:block;font-size:19px;letter-spacing:-.02em;line-height:1.1}.kpi span{font-size:11.5px;color:var(--mute)}
.hbars{display:flex;gap:12px;margin-top:2px;font-size:11.5px;color:var(--mute);flex-wrap:wrap}.hbars span+span::before{content:'|';margin-right:12px;opacity:.5}
#homegrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
#mapwrap{position:relative;height:calc(100vh - var(--top) - 92px);min-height:460px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--acc) 7%,var(--bg)),var(--bg) 75%);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}
#cv:active{cursor:grabbing}
#mapwrap.fs{position:fixed;inset:0;z-index:100;border:0;border-radius:0;height:100vh;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--acc) 9%,var(--bg)),var(--bg) 80%)}
#mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;color:var(--mute)}.seg button.on{background:var(--acc);color:var(--onacc)}
#mapbtns{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:3}
#mapwrap.fs #mapctl,#mapwrap.fs #mapbtns,#mapwrap.fs #legend{opacity:0;pointer-events:none}
#legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--mute);z-index:3;background:color-mix(in srgb,var(--bg) 60%,transparent);padding:6px 10px;border-radius:9px}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#mapinfo{position:absolute;z-index:4;left:50%;bottom:16px;transform:translateX(-50%);width:min(430px,92%);padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);display:none}
#mapinfo.on{display:block}
#mapwrap.fs #mapinfo{display:none}
#fsx{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff44;background:#00000066;color:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
#fsx.show{opacity:.85;pointer-events:auto}#fsx svg{width:18px;height:18px}
#emptymap{position:absolute;inset:0;display:none;place-items:center;text-align:center;z-index:2;padding:20px}
#emptymap.on{display:grid}
#emptymap>div{max-width:380px;pointer-events:auto}
#emptymap h3{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
/* Today list */
.titem{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 40%,transparent);margin-bottom:8px;position:relative;overflow:hidden}
.titem.done{opacity:.62}
.titem .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;border:2px solid var(--c)}
.titem.quit .dot{border-style:dashed}
.titem .nm{font-weight:700;cursor:pointer;line-height:1.2}
.titem .sub{font-size:12px;color:var(--mute)}
.titem.must::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ffd23f}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:none;flex:none;display:grid;place-items:center;color:var(--c);transition:.15s}
.chk:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}.chk.on{background:var(--c);color:#06080d}.chk svg{width:18px;height:18px}
.qa{display:flex;gap:6px}.qa .btn{padding:6px 10px;font-size:12.5px}
.nextup{border:1px dashed color-mix(in srgb,var(--acc) 60%,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;background:color-mix(in srgb,var(--acc) 7%,transparent)}
/* drawer & modal */
#shade{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:.2s}#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:41;background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#drawer.on{transform:none}
#dhead{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#dtabs{display:flex;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
#dtabs button{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--mute);font-weight:600}#dtabs button.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--ink)}
#dbody{flex:1;overflow:auto;padding:16px 18px 40px}
#modal{position:fixed;z-index:42;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#mbox{width:min(760px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
/* forms */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;padding:6px 11px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mute)}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border:1px solid var(--line);border-radius:12px;background:none;text-align:left;min-width:0}
.tpl:hover{border-color:var(--acc)}.tpl.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}.tpl b{font-size:13.5px}.tpl span{font-size:11.5px;color:var(--mute)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exbox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--acc) 6%,transparent);font-size:13px}
.fld{margin-top:12px}.fld>label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:5px}
.fld .ex{font-weight:400;color:var(--mute);font-size:12px}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;font-size:24px;color:var(--line);padding:0 2px}.stars button.on{color:#ffd23f}
.togg{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line);transition:.2s;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--acc)}.sw.on::after{left:19px}
/* goals view */
.gcard{display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s}.gcard:hover{border-color:var(--acc);transform:translateY(-1px)}
.ring{width:56px;height:56px;flex:none;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:11.5px;color:var(--mute);text-align:center;font-weight:600}
.cday{min-height:88px;border:1px solid var(--line);border-radius:10px;padding:6px;background:color-mix(in srgb,var(--panel) 80%,transparent);cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cday:hover{border-color:var(--acc)}.cday.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.cday.sel{background:color-mix(in srgb,var(--acc) 14%,var(--panel))}.cday.out{opacity:.35}
.cday .n{font-size:12px;font-weight:700}
.ce{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ce.done{background:var(--c);color:#06080d;font-weight:700}.ce.slip{background:#ff5d7355;border-color:#ff5d73}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}.heat i{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}table.t th{color:var(--mute);font-weight:600;font-size:12px}
.svgc{width:100%;height:auto;display:block}
/* toast */
#toasts{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,94%)}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0008;animation:tin .25s}
.toast button{background:none;border:0;color:var(--acc);font-weight:800;padding:0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* credit */
#credit{position:relative;z-index:2;text-align:center;padding:16px 10px 74px;font-size:13px;color:var(--mute)}
#credit .heart{display:inline-block;color:#ff2d55;animation:beat 1.2s infinite;margin:0 3px}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
#credit a{color:#ff9500;text-decoration:none;font-weight:700;transition:.2s}#credit a:hover{color:#e1306c;text-shadow:0 0 12px #e1306c88}
/* splash */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .7s;animation:splashSafe .6s 6.5s forwards}
#splash.out{opacity:0;pointer-events:none}
@keyframes splashSafe{to{opacity:0;visibility:hidden}}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash .sc{position:relative;z-index:2;padding:20px;max-width:560px}
#splash .tg{font-size:19px;opacity:0;animation:fadein 1s 1.6s forwards}
#splash .sq{margin-top:28px;font-size:15px;color:var(--mute);opacity:0;animation:fadein 1s 2.2s forwards;font-style:italic}
#splash .ss{margin-top:18px;font-size:12.5px;color:var(--mute);opacity:0;animation:fadein 1s 2.8s forwards}
@keyframes fadein{to{opacity:1}}
/* bottom nav (mobile) */
#bnav{display:none}
/* responsive */
@media(max-width:1100px){#homegrid{grid-template-columns:1fr}#mapwrap{height:72vh}#hero{grid-template-columns:1fr}#kpis{flex-wrap:wrap}}
@media(max-width:820px){
 :root{--top:52px}#nav{display:none}#sndbtn{display:none}.brand small{display:none}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 #bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 0;color:var(--mute);font-weight:600}#bnav button svg{width:21px;height:21px}#bnav button.on{color:var(--acc)}
 .g2,.g3,.g4{grid-template-columns:1fr 1fr}.wrap{padding:14px 12px 90px}#greet{font-size:22px}#quote{font-size:18px}
 #mapwrap{height:68vh;min-height:380px}.cday{min-height:58px;padding:3px}.ce{font-size:9.5px;padding:0 3px}
 #topr .btn span{display:none}
}
@media(max-width:820px){#hero{gap:8px;padding-bottom:8px}#hbars{display:none}#kpis{flex-wrap:nowrap;gap:6px}.kpi{min-width:0;flex:1;padding:7px 8px}.kpi b{font-size:18px}.kpi span{font-size:10.5px;line-height:1.2;display:block}#quote{min-height:0;font-size:17px}#toasts{bottom:calc(74px + env(safe-area-inset-bottom))}.toast{font-size:13px;padding:8px 12px}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}.kpi{min-width:0;flex:1}.cal{gap:3px}.ce{display:none}.cday .dots{display:flex}}
.dots{display:flex;gap:2px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}.dots i.h{background:none;border:1.5px solid var(--c)}
@media print{#top,#bnav,#bgfx{display:none}}

/* ===== v5 additions ===== */
#fxcv{position:fixed;inset:0;z-index:90;pointer-events:none}
body.shk #app{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#guidebtn{display:none}
@media(max-width:820px){#guidebtn{display:grid}}
.gico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);flex:none}
.gico svg{width:16px;height:16px}.gico.lg{width:44px;height:44px}.gico.lg svg{width:24px;height:24px}
.titem .dot svg{width:18px;height:18px;color:var(--c)}
.titem.fired{animation:rowfire 1.5s ease-out}
.titem.fired .chk{animation:chkpop .55s}
@keyframes rowfire{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 75%,transparent);background:color-mix(in srgb,var(--c) 30%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
@keyframes chkpop{0%{transform:scale(.55)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}

function stLabel(g,st){const w=winState(g),parts=[];
 if(st.flex)parts.push(`${st.c}/${st.q} this ${g.sched.t==='weekly'?'week':'month'}${st.urgent?' - needed soon':''}`);
 if(g.win)parts.push(g.win[0]+' to '+g.win[1]+(w&&w.s==='now'?' (now)':w&&w.s==='past'?' (passed)':''));
 const sn=streakInfo(g);if(sn.n>0)parts.push(sn.n+sn.unit+' streak');return parts.join('  |  ')}
function todayRow(it){const g=it.g,st=it.st,q=isB(g),done=st.s==='done',slip=st.s==='slip',k=todayKey();
 const canTick=['due','optional','done','rest'].includes(st.s)&&!(st.s==='rest'&&!st.met&&!st.flex);
 let right='';
 if(slip)right=`<span class="pill quit">Slipped</span><button class="btn sm ghost" data-act="done" data-id="${g.id}">Redo</button>`;
 else if(st.s==='skipped')right=`<span class="pill">Rest</span>`;
 else if(canTick)right=q?`<div class="qa">${done?'':`<button class="btn danger sm" data-act="slip" data-id="${g.id}">Slip</button>`}<button class="chk ${done?'on':''}" data-act="done" data-id="${g.id}" aria-label="${done?'Undo':'Mark clean'}" title="${q?'Clean day':'Done'}">${ic('check')}</button></div>`
  :`<div class="qa">${!done&&st.s!=='rest'?`<button class="btn ghost sm" data-act="skip" data-id="${g.id}" title="Planned rest">${ic('skip')}</button>`:''}<button class="chk ${done?'on':''}" data-act="done" data-id="${g.id}" aria-label="${done?'Undo':'Mark done'}">${ic('check')}</button></div>`;
 else if(st.s==='notstarted')right=`<span class="pill">${fmtD(g.start)}</span>`;
 return `<div class="titem ${done?'done':''} ${q?'quit':''} ${g.priority==='must'?'must':''} ${JF[g.id]>Date.now()?'fired':''}" style="--c:${g.color}"><div class="dot" data-act="open" data-id="${g.id}" style="cursor:pointer">${gI(g,18)}</div><div style="min-width:0;flex:1"><div class="nm" data-act="open" data-id="${g.id}">${esc(g.name)}${g.priority==='must'?' <span class="pill must">Must</span>':''}</div><div class="sub">${esc(stLabel(g,st)||schedText(g))}</div></div>${right}</div>`}
function renderToday(){const k=todayKey(),items=todayItems(k),el=$('#today');
 const main=items.filter(i=>['due','done','slip','optional'].includes(i.st.s)),rest=items.filter(i=>!['due','done','slip','optional'].includes(i.st.s));
 const nu=nextUp(),dd=S.daily[k]||{};
 const nuHtml=nu?`<div class="nextup"><b>Next up:</b> ${esc(nu.g.name)}${nu.w&&nu.w.s==='now'?' - your window is open now':nu.w&&nu.w.s==='soon'?' - window opens in '+dur(nu.w.in):nu.st.urgent?' - needs a session soon to hit your weekly target':''}</div>`:'';
 const chk=`<details class="card" style="margin-top:12px;padding:10px 14px" ${dd.mood||dd.sleep?'':''}><summary class="b" style="cursor:pointer">Daily check-in ${dd.mood?'(logged)':''}</summary>
  <label class="f">Mood</label><div class="stars" data-for="mood">${[1,2,3,4,5].map(n=>`<button data-act="dly" data-k="mood" data-v="${n}" class="${(dd.mood||0)>=n?'on':''}">★</button>`).join('')}</div>
  <label class="f">Energy</label><div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="dly" data-k="energy" data-v="${n}" class="${(dd.energy||0)>=n?'on':''}">★</button>`).join('')}</div>
  <label class="f">Sleep last night (hours)</label><input type="number" step=".5" min="0" max="16" value="${dd.sleep==null?'':dd.sleep}" data-chg="dlysleep" placeholder="7.5">
  <label class="f">One line about today</label><input type="text" value="${esc(dd.note||'')}" data-chg="dlynote" placeholder="What stood out?"></details>`;
 el.innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">Today</h3><span class="mute sm">${fmtLong(k)}</span></div>${nuHtml}
  ${main.length?main.map(todayRow).join(''):`<div class="mute sm" style="padding:6px 2px 10px">${S.goals.length?'Nothing due today.':'No goals yet. Add one to start.'}</div>`}
  ${rest.length?`<details><summary class="mute sm" style="cursor:pointer;margin:6px 0 8px">Rest days and upcoming (${rest.length})</summary>${rest.map(todayRow).join('')}</details>`:''}</div>${chk}`}

let DRAFT=null;
function openDrawer(id,tab,date){const g=gById(id);if(!g)return;sfx('open');UI.drawer={id,tab:tab||'log',date:date||todayKey()};if(UI.drawer.date<g.start)UI.drawer.date=g.start;if(UI.drawer.date>g.end&&todayKey()>g.end)UI.drawer.date=g.end;
 closeModal();$('#drawer').classList.add('on');$('#shade').classList.add('on');initDraft();renderDrawer()}
function closeDrawer(quiet){if(!UI.drawer.id)return;UI.drawer.id=null;DRAFT=null;$('#drawer').classList.remove('on');if(!$('#modal').classList.contains('on'))$('#shade').classList.remove('on');if(!quiet)sfx('close')}
function initDraft(){const g=gById(UI.drawer.id);if(!g)return;const l=g.logs[UI.drawer.date];DRAFT=l&&!l.skip?JSON.parse(JSON.stringify(l)):{};if(!DRAFT.f)DRAFT.f={};
 if(!l&&!isB(g)){if(g.core.min)DRAFT.min=g.defMin||0}}
function fieldInput(f,v,pre){const id=`data-inp="dr" data-p="f:${f.id}"`;v=v==null?'':v;
 if(f.type==='number')return `<div class="row"><input type="number" step="any" inputmode="decimal" value="${esc(v)}" ${id} placeholder="${esc(f.ex)}">${f.unit?`<span class="mute sm">${esc(f.unit)}</span>`:''}</div>`;
 if(f.type==='text')return `<input type="text" value="${esc(v)}" ${id} placeholder="${esc(f.ex)}">`;
 if(f.type==='longtext')return `<textarea ${id} placeholder="${esc(f.ex)}">${esc(v)}</textarea>`;
 if(f.type==='time')return `<input type="time" value="${esc(v)}" ${id}>`;
 if(f.type==='rating')return `<div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="drstar" data-fid="${f.id}" data-v="${n}" class="${(+v||0)>=n?'on':''}">★</button>`).join('')}</div>`;
 if(f.type==='check')return `<label class="togg"><span class="sw ${v?'on':''}" data-act="drchk" data-fid="${f.id}"></span><span>${v?'Yes':'No'}</span></label>`;
 if(f.type==='select')return `<div class="chips">${(f.opts||[]).map(o=>`<button class="chip ${v===o?'on':''}" data-act="drsel" data-fid="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;return ''}

 if(isB(g)&&g.limit>0&&l.amt!==undefined&&l.amt!==''){if(+l.amt>g.limit){const old=logSlip(g,k,{urges:l.urges,trig:l.trig,amt:l.amt,note:l.note,f:l.f});afterLog(g);initDraft();renderDrawer(true);toast('Over the limit, so this counts as a slip.',undoer(g,k,old));return}}

const TRIGGERS=['Boredom','Stress','Tired','Social','After a meal','Alone','Late night','Anger','Habit loop'];
function logTab(g){const k=UI.drawer.date,st=dueState(g,k),l=g.logs[k],q=isB(g),d=DRAFT||{f:{}};
 const stTxt={done:q?'Clean':'Logged',slip:'Slipped',skipped:'Planned rest',due:'Due',optional:'Optional',rest:'Rest day',notstarted:'Not started',ended:'Round ended',paused:'Paused'}[st.s];
 let h=`<div class="row" style="margin-bottom:10px"><button class="ibtn" data-act="drday" data-d="-1" style="width:34px;height:34px">${ic('back')}</button><input type="date" value="${k}" min="${g.start}" max="${todayKey()<g.end?todayKey():g.end}" data-chg="drdate" style="max-width:170px"><button class="ibtn" data-act="drday" data-d="1" style="width:34px;height:34px">${ic('fwd')}</button><span class="pill ${st.s==='done'?'ok':st.s==='slip'?'quit':''}">${stTxt}${st.flex?` ${st.c}/${st.q}`:''}</span></div>`;
 if(q){h+=`<div class="card" style="margin-bottom:12px"><b>Urges today</b><div class="row" style="margin-top:8px"><button class="btn sm" data-act="drurge" data-d="-1">-</button><b style="font-size:22px;min-width:30px;text-align:center">${d.urges||0}</b><button class="btn sm" data-act="drurge" data-d="1">+</button><span class="mute sm">Every urge you ride out weakens the old pathway</span></div>
  <label class="f">What triggered it?</label><div class="chips">${TRIGGERS.map(t=>`<button class="chip ${d.trig===t?'on':''}" data-act="drtrig" data-v="${t}">${t}</button>`).join('')}</div>
  ${g.limit>0?`<label class="f">Amount today (limit ${g.limit})</label><input type="number" step="any" value="${d.amt==null?'':d.amt}" data-inp="dr" data-p="amt" placeholder="0">`:''}</div>`}
 else{h+=`<div class="grid g2">`;
  if(g.core.min)h+=`<div><label class="f" style="margin-top:0">Minutes</label><input type="number" min="0" value="${d.min==null?'':d.min}" data-inp="dr" data-p="min"></div>`;
  if(g.core.prep)h+=`<div><label class="f" style="margin-top:0">Prep minutes</label><input type="number" min="0" value="${d.prep==null?'':d.prep}" data-inp="dr" data-p="prep"></div>`;
  h+=`</div>`;

  if(g.fields.length&&!g.hideEx&&!l){h+=`<div class="exbox" style="margin-top:12px"><b>Example entry</b><div class="sm" style="margin:5px 0 8px">${g.fields.filter(f=>f.ex!=='').map(f=>`<div><span class="mute">${esc(f.label)}:</span> ${esc(f.ex)}${f.unit?' '+esc(f.unit):''}</div>`).join('')}</div><div class="row"><button class="btn sm" data-act="usex">Use this example</button><button class="btn sm ghost" data-act="hidex">Delete examples</button></div></div>`}
  else if(g.fields.length&&g.hideEx)h+=`<div class="mute xs" style="margin-top:8px"><a href="#" data-act="hidex">Show example entry again</a></div>`;
  g.fields.forEach(f=>{h+=`<div class="fld"><label>${esc(f.label)}${f.unit&&f.type!=='number'?` <span class="ex">(${esc(f.unit)})</span>`:''}${!g.hideEx&&f.ex!==''&&f.type!=='check'?`<span class="ex">e.g. ${esc(f.ex)}</span>`:''}</label>${fieldInput(f,d.f[f.id])}</div>`});
  if(g.tasks.length){const c=g.chk[k]||[];h+=`<label class="f">Checklist</label>`+g.tasks.map((t,i)=>`<label class="togg" style="margin:6px 0" data-act="drtask" data-i="${i}"><span class="sw ${c.includes(i)?'on':''}"></span><span>${esc(t)}</span></label>`).join('')}}
 h+=`<label class="f">Note</label><textarea data-inp="dr" data-p="note" placeholder="How did it go? What did you notice?">${esc(d.note||'')}</textarea>`;
 h+=`<div class="row wrapr" style="margin-top:14px"><button class="btn pri" data-act="savelog">${q?'Save clean day':(l&&!l.skip&&!l.slip?'Update log':'Save log')}</button>${q?`<button class="btn danger" data-act="slipsave">I slipped</button>`:`<button class="btn" data-act="restsave">${ic('skip')} Planned rest</button>`}${l?`<button class="btn ghost danger" data-act="clrlog">Clear</button>`:''}</div>`;
 const rec=Object.keys(g.logs).sort().reverse().slice(0,6);

function logRows(g){return Object.keys(g.logs).sort().map(k=>{const l=g.logs[k],o={date:k,status:l.slip?'slip':l.skip?'planned rest':(isB(g)?'clean':'done')};
 if(l.t)o.time=l.t;if(l.min!=null&&l.min!=='')o.minutes=l.min;if(l.prep)o.prepMinutes=l.prep;if(l.q)o.quality=l.q;if(l.urges)o.urges=l.urges;if(l.trig)o.trigger=l.trig;if(l.amt!=null&&l.amt!=='')o.amount=l.amt;
 if(l.f){const f={};g.fields.forEach(fd=>{const v=l.f[fd.id];if(v!==undefined&&v!=='')f[fd.label+(fd.unit?' ('+fd.unit+')':'')]=v});if(Object.keys(f).length)o.fields=f}
 const c=g.chk[k];if(c&&c.length&&g.tasks.length)o.checklistDone=c.map(i=>g.tasks[i]).filter(Boolean);if(l.note)o.note=l.note;return o})}
function exportObj(){const t=todayKey();return{app:APPNAME,tagline:TAGLINE,format:4,exportedAt:new Date().toISOString(),today:t,
 readme:'Human-readable summary first, then every goal with its stats and a dated log. The _state block at the bottom is the full lossless backup used by Import.',
 summary:{goals:S.goals.length,activeGoals:S.goals.filter(g=>!g.paused&&g.start<=t&&g.end>=t).length,brainStrengthPct:Math.round(overallStrength()*100),completionLast7DaysPct:Math.round((rateBetween(addD(t,-6),t)||0)*100),completionLast30DaysPct:Math.round((rateBetween(addD(t,-29),t)||0)*100),badges:S.badges.length},
 goals:S.goals.map(g=>{const s=gStats(g);return{name:g.name,kind:isB(g)?'quit':'build',priority:PRI[g.priority].n,category:g.cat,schedule:schedText(g),window:g.win?g.win.join(' to '):null,reminders:g.remind.on?g.remind.times:[],round:{start:g.start,end:g.end,days:lenDays(g),paused:g.paused},why:g.why,cue:g.cue,successLooks:g.metric,
  stats:{repsDone:s.done,repsExpectedSoFarOrRound:s.expT,adherencePct:s.adh==null?null:Math.round(s.adh*100),currentStreak:s.streak+' '+s.unit,bestStreak:s.best,strengthPct:Math.round(s.level*100),minutesLogged:s.min,avgQuality:s.q?+s.q.toFixed(2):null,slips:s.slips,urgesRiddenOut:s.urges,pace:s.pace},
  logFields:g.fields.map(f=>f.label+(f.unit?' ('+f.unit+')':'')),checklist:g.tasks,reviews:(g.reviews||[]).map(r=>({date:r.d.slice(0,10),worked:r.w,gotInTheWay:r.b,change:r.a,rating:r.r})),logs:logRows(g)}}),
 dailyCheckins:Object.keys(S.daily).sort().map(k=>Object.assign({date:k},S.daily[k])),journalEntries:(S.journal||[]).slice().sort((a,b)=>a.d<b.d?-1:1).map(j=>({date:j.d,time:j.t,title:j.title,text:j.tx,mood:j.mood||null,energy:j.energy||null,tags:j.tags,goal:(gById(j.goal)||{}).name||null})),badgesEarned:S.badges,_state:S}}

ACT.excsv=()=>{const rows=[];S.goals.forEach(g=>logRows(g).forEach(r=>rows.push(Object.assign({goal:g.name,kind:isB(g)?'quit':'build'},r))));
 const base=['date','goal','kind','status','time','minutes','prepMinutes','quality','amount','urges','trigger'],ext=[];rows.forEach(r=>{if(r.fields)Object.keys(r.fields).forEach(k=>{if(!ext.includes(k))ext.push(k)})});
 const cols=base.concat(ext,['checklistDone','note']),q=v=>{v=v==null?'':Array.isArray(v)?v.join('; '):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.goal.localeCompare(b.goal));
 const out=[cols.join(',')].concat(rows.map(r=>cols.map(c=>base.includes(c)||c==='checklistDone'||c==='note'?q(r[c]):q(r.fields&&r.fields[c])).join(',')));downloadText(`neuroorbitsynapse-logs-${stamp()}.csv`,out.join('\n'),'text/csv');toast('CSV downloaded')};
function mdReport(){const t=todayKey(),o=exportObj();let L=[`# ${APPNAME} progress report`,`Generated ${fmtLong(t)}`,'',`Brain strength ${o.summary.brainStrengthPct}%. Completion: ${o.summary.completionLast7DaysPct}% over 7 days, ${o.summary.completionLast30DaysPct}% over 30 days. ${o.summary.activeGoals} active goal(s).`,''];
 o.goals.forEach(g=>{L.push(`## ${g.name} (${g.kind}, ${g.priority})`,`- Schedule: ${g.schedule}${g.window?', window '+g.window:''}`,`- Round: ${g.round.start} to ${g.round.end}${g.round.paused?' (paused)':''}`,`- Reps ${g.stats.repsDone}/${g.stats.repsExpectedSoFarOrRound}, adherence ${g.stats.adherencePct==null?'n/a':g.stats.adherencePct+'%'}, streak ${g.stats.currentStreak}, best ${g.stats.bestStreak}, strength ${g.stats.strengthPct}%`,`- Time logged ${g.stats.minutesLogged} min${g.stats.avgQuality?', avg quality '+g.stats.avgQuality:''}${g.kind==='quit'?`, slips ${g.stats.slips}, urges ${g.stats.urgesRiddenOut}`:''}`);
  if(g.why)L.push(`- Why: ${g.why}`);if(g.cue)L.push(`- Cue: ${g.cue}`);const last=g.logs.slice(-14);if(last.length){L.push('','Recent logs:');last.forEach(l=>L.push(`- ${l.date} ${l.status}${l.minutes?' '+l.minutes+'m':''}${l.fields?' '+Object.entries(l.fields).map(e=>e.join(': ')).join(', '):''}${l.note?' | '+l.note:''}`))}
  if(g.reviews.length){L.push('','Latest review:');const r=g.reviews[0];L.push(`- ${r.date}: worked "${r.worked}", obstacle "${r.gotInTheWay}", change "${r.change}"`)}L.push('')});
 const jr=(o.journalEntries||[]).slice(-8);if(jr.length){L.push('## Journal (latest entries)');jr.forEach(j=>L.push(`- ${j.date}${j.title?' '+j.title:''}: ${String(j.text).replace(/\n+/g,' ').slice(0,300)}${j.tags.length?' ['+j.tags.join(', ')+']':''}`));L.push('')}
 const dc=o.dailyCheckins.slice(-14);if(dc.length){L.push('## Daily check-ins');dc.forEach(d=>L.push(`- ${d.date}: mood ${d.mood||'-'}, energy ${d.energy||'-'}, sleep ${d.sleep==null?'-':d.sleep+'h'}${d.note?' | '+d.note:''}`))}return L.join('\n')}

function importData(o){let inc=null;
 if(Array.isArray(o))inc=normState({goals:fromLegacyGoals(o)});
 else if(o&&o._state&&o._state.goals)inc=normState(o._state);
 else if(o&&Array.isArray(o.goals)&&o.goals.length&&o.goals[0].logs&&!o.goals[0].stats)inc=normState(o);
 if(!inc||!inc.goals.length){toast('No goals found in that file.');return}
 let add=0,upd=0;inc.goals.forEach(ng=>{const ex=gById(ng.id)||S.goals.find(g=>g.name===ng.name&&g.start===ng.start);
  if(ex){Object.assign(ex.logs,ng.logs);Object.keys(ng.chk||{}).forEach(k=>{ex.chk[k]=ng.chk[k]});if((ng.reviews||[]).length>(ex.reviews||[]).length)ex.reviews=ng.reviews;upd++}else{S.goals.push(ng);add++}});
 (inc.journal||[]).forEach(j=>{if(!S.journal.some(x=>x.id===j.id))S.journal.push(j)});
 Object.keys(inc.daily).forEach(k=>{S.daily[k]=Object.assign({},inc.daily[k],S.daily[k]||{})});
 inc.badges.forEach(b=>{if(!S.badges.some(x=>(x.id||x)===(b.id||b)))S.badges.push(b)});
 S.goals=S.goals.map(g=>normGoal(g));save();sfx('create');toast(`Imported: ${add} new goal(s), ${upd} updated.`);ORDER_RESET();renderAll()}

 for(let yy=0;yy<oc.height;yy+=step)for(let xx=0;xx<oc.width;xx+=step)if(img[(yy*oc.width+xx)*4+3]>128){const a=Math.random()*6.283,r=Math.max(w,h)*(.6+Math.random()*.5);P.push({tx:xx,ty:yy+ty,sx:cx0+Math.cos(a)*r,sy:cy0+Math.sin(a)*r,d:Math.random()*.9,sw:(Math.random()<.5?-1:1)*(1.5+Math.random()*2),c:Math.random()});}

  if(ex>0){const g=x.createRadialGradient(cx0,cy0,0,cx0,cy0,Math.max(w,h)*.7);g.addColorStop(0,`rgba(255,255,255,${Math.min(1,ex)*.28})`);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}
  x.globalCompositeOperation='source-over';

/* ===== Guide: how to use, how it works, why it works + first-run tour ===== */
const G_STEPS=[
 ['target','Add a goal','Tap New goal. Pick a template (reading, workout, trading discipline, quit smoking and more) or start blank. Choose how often: every day, certain weekdays, a number of times per week, every few days, or per month. Give it a start date and a round length. 100 days is the default, you can set any.'],
 ['check','Do it, then tap the check','On Home, the Today list shows what is due. Tap the circle when you finish. You will see the fire: a burst where you tapped, a lightning bolt, and your goal lighting up on the map. For more detail (minutes, quality, your own fields, notes) open the goal and use its Log tab.'],
 ['bell','Set a reminder','Inside a goal, switch on Reminders and pick times. Install the app (Settings) for the best chance of getting alerts. For alerts you can never miss, add the goal to your phone calendar from its Plan tab.'],
 ['cal','Look back and plan','Calendar shows each day at a glance. Tap a day to log, fix or plan it. Week view is a habit grid, Year view is a heat map of your whole year.'],

 ['save','Keep a backup','Everything lives in this browser. Settings has Backup (JSON), CSV and a Markdown report you can paste to Claude for a review. Do it once a week.']];
const G_MAP=[
 ['globe','Universe and Synapse','Universe shows each goal as a planet on its own orbit. Synapse shows each goal as a glowing neuron. In both, the shape grows as your repetitions build up. Switch with the small options button on the map (top right of the map).'],
 ['spark','Progress you can see','Orbit mode: a ring of tiny beads on each orbit, one per slice of the round. Lit beads are reps done. Synapse mode: each neuron has branch tips, and one tip lights up for each slice of the round you completed. Completing a goal today sends a pulse down the branches and a bolt along the links to other goals.'],

const G_WHY=[
 ['Neurons that fire together wire together','Neurons do not touch. They pass signals across tiny gaps called synapses. When two neurons are active at the same moment, repeatedly, the connection between them strengthens. This idea is called Hebbian learning, after the psychologist Donald Hebb. Each time you do the habit, you fire the circuit for it. Each repetition makes the next one a little easier.'],
 ['Long-term potentiation','The strengthening has a physical basis. With repeated activation, the receiving neuron adds receptors and the synapse releases signals more readily. Researchers call this long-term potentiation (LTP). It is one of the best-studied mechanisms behind learning and memory. It builds with spaced repetition, which is why a small action every scheduled day beats a huge burst once a month.'],
 ['Myelin: practice makes the signal faster','Frequently used pathways are insulated with a fatty sheath called myelin, which speeds up signals. That is part of why a practiced skill feels smoother and takes less effort. In the app, the Myelin meter in a goal\'s Progress tab is your current streak measured against 66 repetitions.'],
 ['Pruning: use it or lose it','The brain trims connections that are rarely used and keeps those that are. This is why quit goals shrink. Every clean day gives the old pathway less activity, and a pathway that is not fired fades over time. It does not vanish: a slip fires it again, which is why the app shows it growing back a little. Then the next clean day starts shrinking it again.'],
 ['How long does a habit take?','In a well-known study by Phillippa Lally and colleagues (2009), people took 66 days on average for a new behaviour to feel automatic, and the range was huge, from 18 to 254 days. Missing a single day did not derail the process. This is why the app uses a smoothed strength score instead of an all-or-nothing streak.'],
 ['The cue: "After X, I do Y"','Writing down when and where you will act, called an implementation intention, makes follow-through much more likely in many studies. Give each goal a cue in its Plan. The best cues are things you already do every day: after morning tea, after brushing teeth, when I sit at my desk.'],
 ['Cravings are waves','For quit goals, an urge rises, peaks and falls, usually within minutes, whether or not you act on it. Each urge you ride out without acting on it is a rep of not-doing. Log your urges and triggers. After a few weeks the Triggers chart shows you where the pattern really lives, and that is where to change your environment.'],
 ['Why missing one day is not the end','A habit lives in repeated patterns, not one perfect streak. The app keeps strength as a smoothed score with a half-life of about two weeks. One missed day dips it a little. A week of misses dips it a lot. A restart always lifts it back. The only losing move is stopping altogether, so the best rule is: never miss twice, and make the restart tiny.'],
 ['What the 100 is for','100 repetitions is a motivation tool. It is a round, countable target that makes progress visible and gives you an end date to aim for, so you can review and renew. It is not a scientific threshold. Some habits feel automatic sooner, some later. When your round ends, review it, extend it or set the next one.']];
const G_LIMITS='The neuron and planet pictures are a visual metaphor for how repetition builds habits. The app does not measure your brain. The strength score is a simple, transparent model of your repetition record: it rises when you do a scheduled rep and fades slowly when you do not. If you drink heavily or use substances daily, do not stop suddenly without medical advice, because withdrawal can be dangerous. Talk to a doctor. This app is a tracker, not medical care.';
const G_FAQ=[
 ['Where is my data?','Only in this browser, on this device. Nothing is sent anywhere. Clearing site data or switching browsers would remove it, so use Backup (JSON) in Settings regularly. Installing the app and tapping Protect storage in Settings asks the browser not to clear it.'],
 ['Why did my reminder not ring when the app was closed?','A web app cannot be woken by itself when it is fully closed. Alerts fire while the app is open or running in the background. For guaranteed alerts, download the .ics calendar file (Settings or a goal\'s Plan tab) so your phone\'s calendar rings for you.'],
 ['How do I install it?','On Android Chrome: menu, Install app. On iPhone Safari: Share, Add to Home Screen. On desktop Chrome or Edge: the install icon in the address bar, or Settings, Install. Installed, it opens in its own window with the logo icon.'],
 ['What does Must mean?','Must marks a goal as non-negotiable. It gets a gold ring on the map, sits at the top of Today, and sends extra reminders 30 and 60 minutes after if it is still pending.'],
 ['I did something on the wrong day. Can I fix it?','Yes. Open the Calendar, tap the day, and mark or unmark any goal. Or open the goal, go to Log, and change the date at the top.'],
 ['How do I start again from scratch?','Settings, Clean start deletes all goals and logs but keeps your settings. Reset everything also clears settings. Export a backup first if you are unsure.']];
function renderGuide(){const open=(a,i)=>`<details class="gdet" ${i===0?'open':''}><summary>${esc(a[0])}</summary><p>${esc(a[1])}</p></details>`;
 $('#guidec').innerHTML=`<div class="row wrapr"><div><h2 class="vt">Guide</h2><div class="mute sm">How to use NeuroOrbitSynapse, how it works, and why it works.</div></div><span class="sp"></span><button class="btn pri" data-act="tour">${ic('fwd')} Replay the quick tour</button></div>
 <div class="ghero card"><div class="serif" style="font-size:24px;line-height:1.2">Every time you repeat something, the circuit for it gets stronger. This app lets you watch that happen.</div><p class="mute" style="margin:8px 0 0">Each goal is a neuron or a planet. Do the habit and it fires, grows and brightens. Quit a habit and its old pathway shrinks. You supply the repetition. The app keeps the score and shows the progress.</p></div>
 <h3 class="h3 gh">Quick start</h3><div class="grid g3 gsteps">${G_STEPS.map((s,i)=>`<div class="card gstep"><div class="row"><span class="gnum">${i+1}</span><span class="gico" style="--c:var(--acc)">${gico(s[0],16)}</span></div><b>${esc(s[1])}</b><p class="sm mute">${esc(s[2])}</p></div>`).join('')}</div>
 <h3 class="h3 gh">Reading the map</h3><div class="grid g2">${G_MAP.map(s=>`<div class="card gstep"><div class="row"><span class="gico" style="--c:var(--acc2)">${gico(s[0],16)}</span><b>${esc(s[1])}</b></div><p class="sm mute">${esc(s[2])}</p></div>`).join('')}</div>
 <h3 class="h3 gh">Why it works</h3><div class="card gwhy">${G_WHY.map(open).join('')}<p class="xs mute" style="margin:12px 0 0">Sources of the ideas: Donald Hebb (1949, Hebbian learning); Bliss and Lomo (1973, long-term potentiation); Lally et al. (2009, European Journal of Social Psychology, habit formation); Gollwitzer (1999, implementation intentions). Dr Lee Warren's book popularised the "fire together, wire together" framing for everyday readers.</p></div>
 <h3 class="h3 gh">How the strength score works</h3><div class="card"><p class="sm" style="margin:0">Each scheduled day counts as a chance. A rep adds to the score, a missed scheduled day lets it fade. The score is exponentially smoothed with a half-life of about 14 days for daily goals, so recent days matter most and one bad day is forgiven. Days off your schedule, planned rests and paused time are not counted against you. For quit goals the score is the strength of the old pathway: it decays with each clean day and gets a boost back when you slip.</p></div>
 <h3 class="h3 gh">Honest limits</h3><div class="card" style="border-color:color-mix(in srgb,var(--acc) 45%,var(--line))"><p class="sm" style="margin:0">${esc(G_LIMITS)}</p></div>
 <h3 class="h3 gh">Questions</h3><div class="card gwhy">${G_FAQ.map(open).join('')}</div>`}

const TOUR=[
 ['spark','Welcome to NeuroOrbitSynapse','Wire your habits. Orbit your goals. Every goal is a neuron or a planet. The more you repeat it, the stronger and brighter it grows.'],
 ['target','Add a goal and tap the check','Pick a template or build your own, then tap the circle in Today when you do it. You will see it fire: a burst of light, a bolt along the links, and the goal flashing on the map.'],

 ['music','Music and sounds','Turn on generative background music with the note button at the top. Sound effects have their own switch. Both are generated live, nothing downloads.']];
